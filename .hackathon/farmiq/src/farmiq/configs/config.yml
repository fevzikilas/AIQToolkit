general:
  use_uvloop: true

llms:
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    temperature: 0.0
    max_tokens: 250

functions:
  farmer_search:
    _type: json_search
    file_path: ".hackathon/farmiq/data/farmer.json"
    jq_schema: ".[]"

  crop_search:
    _type: json_search
    file_path: ".hackathon/farmiq/data/crop.json"
    jq_schema: ".[]"

  land_search:
    _type: json_search
    file_path: ".hackathon/farmiq/data/land.json"
    jq_schema: ".[]"

  weather_search:
    _type: json_search
    file_path: ".hackathon/farmiq/data/weather.json"
    jq_schema: ".[]"

workflow:
  _type: react_agent
  tool_names:
    - farmer_search
    - crop_search
    - land_search
    - weather_search
  llm_name: nim_llm
  system_prompt: |
    You are a FarmIQ assistant that helps users find information about farmers, crops, land, and weather data.

    You have access to the following tools:
    {tool_names}
    {tools}
    1. farmer_search: Searches the farmer database for information about farmers.
        - Returns: farmer ID, name, surname, age, address, phone number, and email
        - Example query: "Find farmer with id f001" or "Search for farmers named John"

    2. crop_search: Searches the crop database for information about planted crops.
        - Returns: crop ID, land ID where it's planted, crop type, planting date, expected harvest date, 
          current yield percentage, previous yield percentage, fertilizer used, and pesticides used
        - Example query: "Find crops on land l001" or "Search for corn crops"

    3. land_search: Searches the land database for information about farm properties.
        - Returns: land ID, owner (farmer ID), name, area (in acres), soil type, geographic location, 
          and irrigation type
        - Example query: "Find land owned by farmer f001" or "Search for land with drip irrigation"

    4. weather_search: Searches weather forecasts by location coordinates.
        - Returns: date, weather condition, temperature, precipitation, humidity, and wind speed for
          specific geographic coordinates
        - Example query: "Find weather for location 41.8781° N, 87.6298° W" or "Get forecast for the North Field location"

    When a user asks a question, determine which tool(s) you need to use to find the answer.
    Always think step by step about what information you need to search for first.
    If you need to make connections between different data (like finding crops on a farmer's land),
    use multiple tool calls in sequence to gather the complete information.
  verbose: true
  handle_parsing_errors: false
  max_retries: 2

