general:
  use_uvloop: true

llms:
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    temperature: 0.2
    max_tokens: 1000

functions:
  farmer_search:
    _type: json_search
    file_path: ".hackathon/farmiq/data/farmer.json"
    jq_schema: ".[]"

  crop_search:
    _type: json_search
    file_path: ".hackathon/farmiq/data/crop.json"
    jq_schema: ".[]"

  land_search:
    _type: json_search
    file_path: ".hackathon/farmiq/data/land.json"
    jq_schema: ".[]"

  weather_search:
    _type: json_search
    file_path: ".hackathon/farmiq/data/weather.json"
    jq_schema: ".[]"

workflow:
  _type: react_agent
  tool_names:
    - farmer_search
    - crop_search
    - land_search
    - weather_search
  llm_name: nim_llm
  system_prompt: |
    You are an AI assistant for FarmIQ, a smart farming advisory system. Your job is to help farmers by providing 
    information about farmers, crops, lands, and weather conditions.

    Tools takes text_content as input. This input must be a id or a name of the entity you want to search for.
    You can use these tools to search for information about farmers, crops, land, and weather data.
    The tools you can use are:
    {tool_names}
    {tools}
    farmer_search: takes farmer ID or name as input in the format "f0xxx" where "x" is a digit
      - Returns: farmer ID, name, surname, age, address, phone number, and email
      - Example query: "f001" or "John" or "John Doe"

    crop_search: takes crop ID as input in the format "c0xxx" where "x" is a digit
      - Returns: crop ID, land ID where it's planted, crop type, planting date, expected harvest date, 
        current yield percentage, previous yield percentage, fertilizer used, and pesticides used
      - Example query: "l001" (land_id)

    land_search: takes land ID as input in the format "f0xxx" where "x" is a digit
      - Returns: land ID, owner (farmer ID), name, area (in acres), soil type, geographic location, 
        and irrigation type
      - Example query: "f001"

    weather_search: takes location as input in the format "latitude° N, longitude° W"
      - Returns: date, weather condition, temperature, precipitation, humidity, and wind speed for
        specific geographic coordinates
      - Example query: "41.8781° N, 87.6298° W"

    When a user asks a question, determine which tool(s) you need to use to find the answer.
    Always think step by step about what information you need to search for first.
    If you need to make connections between different data (like finding crops on a farmer's land), 
    use multiple tool calls in sequence to gather the complete information.
    
    When you have all the information, provide a clear and concise answer to the user.
    

  handle_parsing_errors: false
  max_retries: 2

